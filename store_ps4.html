<body>

    <h1>🎮 Juegos Disponibles (PS4)</h1>

    <script>
        function instalar(urlPkg) {
            // Se realiza la petición al RPI de la consola
            fetch('http://127.0.0.1:12800/api/install', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }, // FIXED: Header obligatorio para que pase el payload

            })
            .then(res => {
                if(res.ok) alert('¡Descarga iniciada! Revisa las notificaciones de la consola.');
                else alert('Error en la respuesta del servidor. Verifica que el puerto 12800 esté escuchando.');
            })
            .catch(() => alert('Error de conexión. ¿Está el Remote Package Installer activado?'));
        }
    </script>
